<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ludo-Board</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <div class="ludo">
                <div class="ludo-board">

                    <!-- Red Home (top-left) -->
                    <div class="lbred">
                        <div class="lbred-inner">
                            <div class="lbred-innertop"></div>
                            <div class="lbred-innerleft"></div>
                            <div class="lbred-innerright"></div>
                            <div class="lbred-innerbottom"></div>
                        </div>
                    </div>

                    <!-- Top Pathway (3 cols × 6 rows) -->
                    <div class="yellow-pathway">
                        <div class="yp1"></div>
                        <div class="yp2"></div>
                        <div class="yp3"></div>
                        <div class="yp4"></div>
                        <div class="yp5"></div>
                        <div class="yp6"></div>
                        <div class="yp7"></div>
                        <div class="yp8"></div>
                        <div class="yp9"></div>
                        <div class="yp10"></div>
                        <div class="yp11"></div>
                        <div class="yp12">
                            <div class="inneryp12"></div>
                        </div>
                        <div class="yp13"></div>
                        <div class="yp14"></div>
                        <div class="yp15"></div>
                        <div class="yp16"></div>
                        <div class="yp17"></div>
                        <div class="yp18"></div>
                    </div>

                    <!-- Green Home (top-right) -->
                    <div class="lbgreen">
                        <div class="lbgreen-inner">
                            <div class="lbgreen-innertop"></div>
                            <div class="lbgreen-innerleft"></div>
                            <div class="lbgreen-innerright"></div>
                            <div class="lbgreen-innerbottom"></div>
                        </div>
                    </div>

                    <!-- Left Pathway (6 cols × 3 rows) -->
                    <div class="red-pathway">
                        <div class="rp1"></div>
                        <div class="rp2"></div>
                        <div class="rp3"></div>
                        <div class="rp4"></div>
                        <div class="rp5"></div>
                        <div class="rp6"></div>
                        <div class="rp7">
                            <div class="innerrp7"></div>
                        </div>
                        <div class="rp8"></div>
                        <div class="rp9"></div>
                        <div class="rp10"></div>
                        <div class="rp11"></div>
                        <div class="rp12"></div>
                        <div class="rp13"></div>
                        <div class="rp14"></div>
                        <div class="rp15"></div>
                        <div class="rp16"></div>
                        <div class="rp17"></div>
                        <div class="rp18"></div>
                    </div>

                    <!-- Center Board -->
                    <div class="center-board">
                        <div class="triangle red"></div>
                        <div class="triangle green"></div>
                        <div class="triangle yellow"></div>
                        <div class="triangle blue"></div>
                        <div class="x-divider1"></div>
                        <div class="x-divider2"></div>
                    </div>

                    <!-- Right Pathway (6 cols × 3 rows) -->
                    <div class="green-pathway">
                        <div class="gp1"></div>
                        <div class="gp2"></div>
                        <div class="gp3"></div>
                        <div class="gp4"></div>
                        <div class="gp5"></div>
                        <div class="gp6"></div>
                        <div class="gp7">
                            <div class="innergp7"></div>
                        </div>
                        <div class="gp8"></div>
                        <div class="gp9"></div>
                        <div class="gp10"></div>
                        <div class="gp11"></div>
                        <div class="gp12"></div>
                        <div class="gp13"></div>
                        <div class="gp14"></div>
                        <div class="gp15"></div>
                        <div class="gp16"></div>
                        <div class="gp17"></div>
                        <div class="gp18"></div>
                    </div>

                    <!-- Blue Home (bottom-left) -->
                    <div class="lbblue">
                        <div class="lbblue-inner">
                            <div class="lbblue-innertop"></div>
                            <div class="lbblue-innerleft"></div>
                            <div class="lbblue-innerright"></div>
                            <div class="lbblue-innerbottom"></div>
                        </div>
                    </div>

                    <!-- Bottom Pathway (3 cols × 6 rows) -->
                    <div class="blue-pathway">
                        <div class="bp1"></div>
                        <div class="bp2"></div>
                        <div class="bp3"></div>
                        <div class="bp4"></div>
                        <div class="bp5"></div>
                        <div class="bp6"></div>
                        <div class="bp7"></div>
                        <div class="bp8"></div>
                        <div class="bp9"></div>
                        <div class="bp10"></div>
                        <div class="bp11"></div>
                        <div class="bp12">
                            <div class="innerbp12"></div>
                        </div>
                        <div class="bp13"></div>
                        <div class="bp14"></div>
                        <div class="bp15"></div>
                        <div class="bp16"></div>
                        <div class="bp17"></div>
                        <div class="bp18"></div>
                    </div>

                    <!-- Yellow Home (bottom-right) -->
                    <div class="lbyellow">
                        <div class="lbyellow-inner">
                            <div class="lbyellow-innertop"></div>
                            <div class="lbyellow-innerleft"></div>
                            <div class="lbyellow-innerright"></div>
                            <div class="lbyellow-innerbottom"></div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </body>
</html>
